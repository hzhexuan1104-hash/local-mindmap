[package]
name = "local-mindmap-service"
version = "1.24.7"
description = "A local-only mindmap desktop shell"
authors = ["local-mindmap contributors"]
edition = "2021"

[dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_vendor = "win7"))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_vendor = "win7")'.dependencies]
# This version links CoTaskMemFree to ole32.dll, which is present on Windows 7.
rfd_win7 = { package = "rfd", version = "=0.15.4", default-features = false }
