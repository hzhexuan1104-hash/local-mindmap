name: Build and draft Local Mindmap release

on:
  workflow_dispatch:
    inputs:
      create_draft_release:
        description: Only tag pushes may create a Draft Release; this input is retained for an explicit dry-run UI.
        required: false
        default: false
        type: boolean
      allow_unsigned_macos:
        description: Allow ad-hoc macOS preview packages for a manual artifact-only build.
        required: false
        default: false
        type: boolean
      run_full_tests:
        description: Run frontend, Rust, and headless performance tests in preflight.
        required: false
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      # Keep action majors current; review their release notes before each major upgrade.
      - name: Checkout complete history and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install locked dependencies
        run: npm ci

      - name: Verify clean release workspace
        run: git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Verify version sources
        id: version
        shell: bash
        run: |
          TAG=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ]; then
            node scripts/ci/check-release-version.mjs --tag "$TAG"
          else
            node scripts/ci/check-release-version.mjs
          fi
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify tag points at the checked out release commit
        id: commit
        shell: bash
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
            test "$HEAD_SHA" = "$TAG_SHA"
            test "$HEAD_SHA" = "$GITHUB_SHA"
          fi
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify Tauri bundle icons
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          for (const icon of config.bundle.icon) {
            const path = `src-tauri/${icon}`;
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`Missing or empty icon: ${path}`);
          }
          NODE

      - name: Install Ubuntu 22.04 Tauri dependencies for Rust tests
        if: github.event_name == 'push' || inputs.run_full_tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file build-essential libssl-dev libgtk-3-dev

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        if: github.event_name == 'push' || inputs.run_full_tests
        run: npm run test

      - name: Run Rust tests
        if: github.event_name == 'push' || inputs.run_full_tests
        run: cargo test --manifest-path ./src-tauri/Cargo.toml

      - name: Run headless performance benchmark
        if: github.event_name == 'push' || inputs.run_full_tests
        run: npm run perf:mindmap

  build:
    name: Build ${{ matrix.id }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            user_platform: windows
            user_arch: x64
          - id: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundles: dmg
            user_platform: macos
            user_arch: arm64
          - id: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundles: dmg
            user_platform: macos
            user_arch: x64
          - id: uos-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            user_platform: uos
            user_arch: x64
          - id: uos-arm64
            # Native ARM64 runner is mandatory: do not cross-build or rename x64 AppImages.
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            user_platform: uos
            user_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore target-specific Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}

      - name: Install locked dependencies
        run: npm ci

      - name: Show build toolchain
        run: node --version; npm --version; rustc --version; cargo --version; rustup target list --installed

      - name: Install Ubuntu 22.04 Tauri dependencies
        if: matrix.user_platform == 'uos'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file build-essential libssl-dev libgtk-3-dev

      - name: Require Developer ID credentials for tagged macOS releases
        if: matrix.user_platform == 'macos' && github.event_name == 'push'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required macOS release secret: $name" >&2; exit 1; }
          done
          CERT_PATH="$RUNNER_TEMP/local-mindmap-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/local-mindmap-release.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Configure unsigned macOS preview build
        if: matrix.user_platform == 'macos' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          test "${{ inputs.allow_unsigned_macos }}" = "true" || { echo 'Manual macOS builds require allow_unsigned_macos=true or a signed-release workflow.' >&2; exit 1; }
          echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
          echo 'RELEASE_VARIANT=preview' >> "$GITHUB_ENV"

      - name: Clear previous bundle output and record build start
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const target = process.env.RUST_TARGET;
          for (const candidate of [path.join('src-tauri', 'target', target, 'release', 'bundle'), path.join('src-tauri', 'target', 'release', 'bundle')]) fs.rmSync(candidate, { recursive: true, force: true });
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_BUILD_STARTED_AT=${new Date().toISOString()}\n`);
          NODE
        env:
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Build target bundles
        run: npm run tauri:build -- --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --verbose

      - name: Collect standardized release assets
        shell: bash
        run: node scripts/ci/collect-release-assets.mjs --platform ${{ matrix.user_platform }} --arch ${{ matrix.user_arch }} --target ${{ matrix.rust_target }} --version ${{ needs.preflight.outputs.version }} --variant "${RELEASE_VARIANT:-}" --build-start "$RELEASE_BUILD_STARTED_AT"

      - name: Verify bundle format, version, and native architecture
        shell: bash
        run: node scripts/ci/verify-release-assets.mjs --platform ${{ matrix.user_platform }} --arch ${{ matrix.user_arch }} --version ${{ needs.preflight.outputs.version }} --variant "${RELEASE_VARIANT:-}" --macos-signed ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Write build provenance
        shell: bash
        run: node scripts/ci/write-build-info.mjs --platform ${{ matrix.user_platform }} --arch ${{ matrix.user_arch }} --rust-target ${{ matrix.rust_target }} --version ${{ needs.preflight.outputs.version }} --tag "${{ needs.preflight.outputs.tag }}" --git-sha "${{ needs.preflight.outputs.commit }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: dist/release/${{ matrix.id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary macOS signing material
        if: always() && matrix.user_platform == 'macos' && github.event_name == 'push'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/local-mindmap-release.p12"
          security delete-keychain "$RUNNER_TEMP/local-mindmap-release.keychain-db" || true

  publish:
    name: Create Draft Release
    needs: [preflight, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.preflight.result == 'success' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tagged release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify tag, SHA, and versions again
        shell: bash
        run: |
          node scripts/ci/check-release-version.mjs --tag "${{ github.ref_name }}"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-list -n 1 "${{ github.ref_name }}")" = "${{ github.sha }}"

      - name: Download all per-platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums and release manifest
        run: node scripts/ci/create-release-metadata.mjs --assets-dir release-assets --version ${{ needs.preflight.outputs.version }} --tag ${{ github.ref_name }} --commit ${{ needs.preflight.outputs.commit }} --workflow-run-id ${{ github.run_id }}

      - name: Create or safely update the Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        shell: bash
        run: |
          if gh release view "$TAG" --json targetCommitish,isDraft >/tmp/local-mindmap-release.json 2>/dev/null; then
            test "$(gh release view "$TAG" --json targetCommitish -q .targetCommitish)" = "$COMMIT"
            test "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --target "$COMMIT" --draft --title "Local Mindmap $TAG" --notes-file docs/release/release-notes-template.md
          fi
