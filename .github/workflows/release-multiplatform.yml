name: Build and draft Local Mindmap release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Tag, branch, or commit to build. Leave empty to build the selected workflow branch.
        required: false
        default: ''
        type: string
      create_draft_release:
        description: Create or safely update a Draft Release.
        required: true
        default: false
        type: boolean
      allow_unsigned_macos:
        description: Allow clearly labeled unsigned macOS preview packages when Apple credentials are unavailable.
        required: true
        default: false
        type: boolean
      run_full_tests:
        description: Run frontend, Rust, and performance tests in preflight.
        required: true
        default: true
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.release_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-22.04
    outputs:
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_commit: ${{ steps.resolve.outputs.release_commit }}
      workflow_commit: ${{ steps.resolve.outputs.workflow_commit }}
      release_version: ${{ steps.version.outputs.release_version }}
      is_tag_release: ${{ steps.resolve.outputs.is_tag_release }}
      apple_signing_ready: ${{ steps.apple.outputs.apple_signing_ready }}
      missing_apple_secrets: ${{ steps.apple.outputs.missing_apple_secrets }}
      macos_distribution_mode: ${{ steps.apple.outputs.macos_distribution_mode }}
      release_mode: ${{ steps.mode.outputs.release_mode }}
    steps:
      - name: Checkout workflow tools from the selected workflow branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve one release source for every platform
        id: resolve
        shell: bash
        run: |
          node scripts/ci/resolve-release-ref.mjs \
            --event-name "$GITHUB_EVENT_NAME" \
            --release-ref "${{ inputs.release_ref }}" \
            --github-ref "$GITHUB_REF" \
            --github-ref-name "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create detached release source worktree
        shell: bash
        run: |
          RELEASE_SOURCE_DIR="$RUNNER_TEMP/release-source"
          git worktree add --detach "$RELEASE_SOURCE_DIR" "${{ steps.resolve.outputs.release_commit }}"
          echo "RELEASE_SOURCE_DIR=$RELEASE_SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/release-source/package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify clean release source workspace
        shell: bash
        run: git -C "$RELEASE_SOURCE_DIR" diff --exit-code && test -z "$(git -C "$RELEASE_SOURCE_DIR" status --porcelain)"

      - name: Verify tag points at the requested release source commit
        shell: bash
        run: |
          if [ "${{ steps.resolve.outputs.is_tag_release }}" = "true" ]; then
            test "$(git -C "$RELEASE_SOURCE_DIR" rev-list -n 1 "${{ steps.resolve.outputs.release_tag }}")" = "${{ steps.resolve.outputs.release_commit }}"
          fi

      - name: Verify version sources in the release source
        id: version
        working-directory: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          VERSION_ARGS=(
            --root "$PWD"
            --release-ref "${{ steps.resolve.outputs.release_ref }}"
          )
          if [ "${{ steps.resolve.outputs.is_tag_release }}" = "true" ]; then
            VERSION_ARGS+=(--tag "${{ steps.resolve.outputs.release_tag }}")
          fi
          node "$GITHUB_WORKSPACE/scripts/ci/check-release-version.mjs" "${VERSION_ARGS[@]}"
          echo "release_version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check Apple signing credentials without exposing values
        id: apple
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          ALLOW_UNSIGNED=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.allow_unsigned_macos }}" = "true" ]; then
            ALLOW_UNSIGNED=true
          fi
          node scripts/ci/check-apple-signing-state.mjs \
            --allow-unsigned "$ALLOW_UNSIGNED" \
            --github-output "$GITHUB_OUTPUT"

      - name: Determine release trigger mode
        id: mode
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ steps.resolve.outputs.is_tag_release }}" = "true" ]; then
            echo "release_mode=manual-tag-repair" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.resolve.outputs.is_tag_release }}" = "true" ]; then
            echo "release_mode=tag-release" >> "$GITHUB_OUTPUT"
          else
            echo "release_mode=manual-preview" >> "$GITHUB_OUTPUT"
          fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "${{ inputs.create_draft_release }}" = "true" ] && [ "${{ steps.resolve.outputs.is_tag_release }}" != "true" ]; then
            echo 'create_draft_release=true requires release_ref to be an existing tag.' >&2
            exit 1
          fi

      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/release-source
        run: npm ci

      - name: Verify Tauri bundle icons
        working-directory: ${{ runner.temp }}/release-source
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          for (const icon of config.bundle.icon) {
            const path = `src-tauri/${icon}`;
            if (!fs.existsSync(path) || fs.statSync(path).size === 0) throw new Error(`Missing or empty icon: ${path}`);
          }
          NODE

      - name: Install Ubuntu 22.04 Tauri dependencies for Rust tests
        if: github.event_name == 'push' || inputs.run_full_tests
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file build-essential libssl-dev libgtk-3-dev

      - name: Build frontend
        working-directory: ${{ runner.temp }}/release-source
        run: npm run build

      - name: Run frontend tests
        if: github.event_name == 'push' || inputs.run_full_tests
        working-directory: ${{ runner.temp }}/release-source
        run: npm run test

      - name: Run Rust tests
        if: github.event_name == 'push' || inputs.run_full_tests
        working-directory: ${{ runner.temp }}/release-source
        run: cargo test --manifest-path ./src-tauri/Cargo.toml

      - name: Run headless performance benchmark
        if: github.event_name == 'push' || inputs.run_full_tests
        working-directory: ${{ runner.temp }}/release-source
        run: npm run perf:mindmap

      - name: Remove detached release source worktree
        if: always()
        shell: bash
        run: git worktree remove --force "$RUNNER_TEMP/release-source" || true

  build:
    name: Build ${{ matrix.id }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            user_platform: windows
            user_arch: x64
          - id: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            bundles: dmg
            user_platform: macos
            user_arch: arm64
          - id: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            bundles: dmg
            user_platform: macos
            user_arch: x64
          - id: uos-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            user_platform: uos
            user_arch: x64
          - id: uos-arm64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
            user_platform: uos
            user_arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0
          path: release-source

      - name: Checkout workflow tools commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_commit }}
          fetch-depth: 1
          path: release-tools

      - name: Set up Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: release-source/package-lock.json

      - name: Set up Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Restore target-specific Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./release-source/src-tauri -> target
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.rust_target }}

      - name: Install locked dependencies
        working-directory: release-source
        run: npm ci

      - name: Show build toolchain
        shell: bash
        run: node --version; npm --version; rustc --version; cargo --version; rustup target list --installed

      - name: Install Ubuntu 22.04 Tauri dependencies
        if: matrix.user_platform == 'uos'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file build-essential libssl-dev libgtk-3-dev

      - name: Set macOS release mode
        if: matrix.user_platform == 'macos'
        shell: bash
        run: |
          MODE="${{ needs.preflight.outputs.macos_distribution_mode }}"
          if [ "$MODE" = "rejected" ]; then
            echo "macOS signing credentials are incomplete: ${{ needs.preflight.outputs.missing_apple_secrets }}" >&2
            echo 'Set all seven Apple secrets for a signed release, or explicitly use workflow_dispatch with allow_unsigned_macos=true.' >&2
            exit 1
          fi
          if [ "$MODE" = "unsigned-preview" ]; then
            echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
            echo 'RELEASE_VARIANT=_unsigned_preview' >> "$GITHUB_ENV"
            echo 'MACOS_SIGNED=false' >> "$GITHUB_ENV"
            echo 'MACOS_NOTARIZED=false' >> "$GITHUB_ENV"
            echo 'MACOS_DISTRIBUTION_STATUS=unsigned-preview' >> "$GITHUB_ENV"
          else
            echo 'RELEASE_VARIANT=' >> "$GITHUB_ENV"
            echo 'MACOS_SIGNED=true' >> "$GITHUB_ENV"
            echo 'MACOS_NOTARIZED=true' >> "$GITHUB_ENV"
            echo 'MACOS_DISTRIBUTION_STATUS=release' >> "$GITHUB_ENV"
          fi

      - name: Import Apple Developer ID signing credentials
        if: matrix.user_platform == 'macos' && needs.preflight.outputs.macos_distribution_mode == 'release'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          CERT_PATH="$RUNNER_TEMP/local-mindmap-release.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/local-mindmap-release.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"

      - name: Clear previous bundle output and record build start
        working-directory: release-source
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const target = process.env.RUST_TARGET;
          for (const candidate of [path.join('src-tauri', 'target', target, 'release', 'bundle'), path.join('src-tauri', 'target', 'release', 'bundle')]) fs.rmSync(candidate, { recursive: true, force: true });
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_BUILD_STARTED_AT=${new Date().toISOString()}\n`);
          NODE
        env:
          RUST_TARGET: ${{ matrix.rust_target }}

      - name: Build target bundles
        working-directory: release-source
        run: npm run tauri:build -- --target ${{ matrix.rust_target }} --bundles ${{ matrix.bundles }} --verbose

      - name: Sign, notarize, staple, and verify macOS release bundles
        if: matrix.user_platform == 'macos' && needs.preflight.outputs.macos_distribution_mode == 'release'
        working-directory: release-source
        shell: bash
        run: |
          APP="$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          DMG="$(find "src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$APP" && test -n "$DMG"
          codesign --force --deep --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$APP"
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$APP"
          xcrun stapler staple "$DMG"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$DMG"
          spctl --assess --type execute --verbose=4 "$APP"
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"

      - name: Collect standardized release assets
        shell: bash
        run: |
          node release-tools/scripts/ci/collect-release-assets.mjs \
            --root "$GITHUB_WORKSPACE/release-source" \
            --platform ${{ matrix.user_platform }} \
            --arch ${{ matrix.user_arch }} \
            --target ${{ matrix.rust_target }} \
            --version ${{ needs.preflight.outputs.release_version }} \
            --variant "${RELEASE_VARIANT:-}" \
            --build-start "$RELEASE_BUILD_STARTED_AT"

      - name: Verify bundle format, version, and native architecture
        shell: bash
        run: |
          VERIFY_ARGS=(
            --root "$GITHUB_WORKSPACE/release-source"
            --platform "${{ matrix.user_platform }}"
            --arch "${{ matrix.user_arch }}"
            --version "${{ needs.preflight.outputs.release_version }}"
            --variant "${RELEASE_VARIANT:-}"
            --macos-signed "${MACOS_SIGNED:-false}"
          )
          if [ "${{ matrix.user_platform }}" = "windows" ]; then
            VERIFY_ARGS+=(--app-binary "$GITHUB_WORKSPACE/release-source/src-tauri/target/${{ matrix.rust_target }}/release/local-mindmap.exe")
          fi
          node release-tools/scripts/ci/verify-release-assets.mjs "${VERIFY_ARGS[@]}"

      - name: Write build provenance
        shell: bash
        run: |
          node release-tools/scripts/ci/write-build-info.mjs \
            --root "$GITHUB_WORKSPACE/release-source" \
            --platform ${{ matrix.user_platform }} \
            --arch ${{ matrix.user_arch }} \
            --rust-target ${{ matrix.rust_target }} \
            --version ${{ needs.preflight.outputs.release_version }} \
            --tag "${{ needs.preflight.outputs.release_tag }}" \
            --git-sha "${{ needs.preflight.outputs.release_commit }}" \
            --release-source-commit "${{ needs.preflight.outputs.release_commit }}" \
            --workflow-commit "${{ needs.preflight.outputs.workflow_commit }}" \
            --distribution-status "${MACOS_DISTRIBUTION_STATUS:-candidate}" \
            --signed "${MACOS_SIGNED:-false}" \
            --notarized "${MACOS_NOTARIZED:-false}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.id }}
          path: release-source/dist/release/${{ matrix.user_platform }}-${{ matrix.user_arch }}/
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary macOS signing material
        if: always() && matrix.user_platform == 'macos'
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/local-mindmap-release.p12"
          security delete-keychain "$RUNNER_TEMP/local-mindmap-release.keychain-db" || true

  publish:
    name: Create Draft Release
    needs: [preflight, build]
    if: >-
      needs.preflight.result == 'success' && needs.build.result == 'success' &&
      needs.preflight.outputs.is_tag_release == 'true' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.create_draft_release))
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout release source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.release_commit }}
          fetch-depth: 0
          path: release-source

      - name: Checkout workflow tools commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.workflow_commit }}
          fetch-depth: 1
          path: release-tools

      - name: Verify release source tag, commit, and versions again
        shell: bash
        run: |
          node release-tools/scripts/ci/check-release-version.mjs \
            --root "$GITHUB_WORKSPACE/release-source" \
            --tag "${{ needs.preflight.outputs.release_tag }}" \
            --release-ref "${{ needs.preflight.outputs.release_ref }}"
          test "$(git -C release-source rev-parse HEAD)" = "${{ needs.preflight.outputs.release_commit }}"
          test "$(git -C release-source rev-list -n 1 "${{ needs.preflight.outputs.release_tag }}")" = "${{ needs.preflight.outputs.release_commit }}"

      - name: Download all per-platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create checksums, manifest, and build summary
        shell: bash
        run: |
          node release-tools/scripts/ci/create-release-metadata.mjs \
            --assets-dir release-assets \
            --version "${{ needs.preflight.outputs.release_version }}" \
            --tag "${{ needs.preflight.outputs.release_tag }}" \
            --release-ref "${{ needs.preflight.outputs.release_ref }}" \
            --release-source-commit "${{ needs.preflight.outputs.release_commit }}" \
            --workflow-commit "${{ needs.preflight.outputs.workflow_commit }}" \
            --release-mode "${{ needs.preflight.outputs.release_mode }}" \
            --macos-distribution-status "${{ needs.preflight.outputs.macos_distribution_mode }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --draft-release-status pending

      - name: Generate safe Draft Release notes
        shell: bash
        run: node release-tools/scripts/ci/generate-release-notes.mjs --manifest release-assets/release-manifest.json --out release-assets/release-notes.md

      - name: Create or safely update the Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node release-tools/scripts/ci/publish-draft-release.mjs \
            --tag "${{ needs.preflight.outputs.release_tag }}" \
            --release-source-commit "${{ needs.preflight.outputs.release_commit }}" \
            --assets-dir release-assets \
            --notes-file release-assets/release-notes.md
